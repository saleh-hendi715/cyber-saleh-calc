name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android project
        run: |
          set -e
          APP_NAME="CalcSLH"
          mkdir -p android_app/app/src/main/java/com/cybersaleh/calc
          mkdir -p android_app/app/src/main/res/layout
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/assets

          cp index.html android_app/app/src/main/assets/index.html

          cat << 'EOF' > android_app/settings.gradle
          rootProject.name = "CalcSLH"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat << 'EOF' > android_app/app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.cybersaleh.calc'
            compileSdk 34

            defaultConfig {
              applicationId "com.cybersaleh.calc"
              minSdk 23
              targetSdk 34
              versionCode 3
              versionName "1.2"
            }

            buildTypes {
              debug {
                minifyEnabled false
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat << EOF > android_app/app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/drawable/ic_calcslh_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path
                android:fillColor="#090D12"
                android:pathData="M14,6h80a8,8 0 0,1 8,8v80a8,8 0 0,1 -8,8h-80a8,8 0 0,1 -8,-8v-80a8,8 0 0,1 8,-8z" />
            <path
                android:fillColor="#10161E"
                android:pathData="M16,10h76a6,6 0 0,1 6,6v52h-88v-52a6,6 0 0,1 6,-6z" />
            <path
                android:strokeColor="#D4AF37"
                android:strokeWidth="2.4"
                android:fillColor="#00000000"
                android:pathData="M14,6h80a8,8 0 0,1 8,8v80a8,8 0 0,1 -8,8h-80a8,8 0 0,1 -8,-8v-80a8,8 0 0,1 8,-8z" />
            <path
                android:fillColor="#DCE8DF"
                android:strokeColor="#D4AF37"
                android:strokeWidth="1.2"
                android:pathData="M24,20h60a4,4 0 0,1 4,4v18a4,4 0 0,1 -4,4h-60a4,4 0 0,1 -4,-4v-18a4,4 0 0,1 4,-4z" />
            <path
                android:strokeColor="#132218"
                android:strokeWidth="2.8"
                android:strokeLineCap="round"
                android:strokeLineJoin="round"
                android:fillColor="#00000000"
                android:pathData="M31,35l4,5l6,-13h11" />
            <path
                android:fillColor="#161F2B"
                android:strokeColor="#D4AF37"
                android:strokeWidth="1.5"
                android:pathData="M62,25h19v13h-19z" />
            <path
                android:strokeColor="#F7DF8B"
                android:strokeWidth="1.8"
                android:strokeLineCap="round"
                android:strokeLineJoin="round"
                android:fillColor="#00000000"
                android:pathData="M69,28.5h-3.2l-1.3,2.5l4.5,1l-1.3,2.5h-3.2M72,28.5v5.5h3.2M77,28.5v5.5M77,31.2h2.8M79.8,28.5v5.5" />
            <path
                android:fillColor="#D4AF37"
                android:pathData="M24,54h16v7h-16zM46,54h16v7h-16zM68,54h16v7h-16z" />
            <path
                android:fillColor="#1E2938"
                android:strokeColor="#2A394D"
                android:strokeWidth="0.9"
                android:pathData="M24,66h16v7h-16zM46,66h16v7h-16zM68,66h16v7h-16zM24,78h16v7h-16zM46,78h16v7h-16z" />
            <path
                android:fillColor="#0F766E"
                android:pathData="M68,78h16v7h-16z" />
          </vector>
          EOF
                    cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="@string/app_name"
              android:icon="@drawable/ic_calcslh_icon"
              android:roundIcon="@drawable/ic_calcslh_icon"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview"
            android:layout_width="match_parent"
            android:layout_height="match_parent" />
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/cybersaleh/calc/MainActivity.java
          package com.cybersaleh.calc;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);

              WebView webView = findViewById(R.id.webview);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/index.html");
            }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android_app
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcSLH-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          
