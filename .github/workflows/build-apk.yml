name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android project
        run: |
          set -e
          APP_NAME="CalcSLH"
          mkdir -p android_app/app/src/main/java/com/cybersaleh/calc
          mkdir -p android_app/app/src/main/res/layout
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/assets

          cp index.html android_app/app/src/main/assets/index.html

          cat << 'EOF' > android_app/settings.gradle
          rootProject.name = "CalcSLH"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat << 'EOF' > android_app/app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.cybersaleh.calc'
            compileSdk 34

            defaultConfig {
              applicationId "com.cybersaleh.calc"
              minSdk 23
              targetSdk 34
              versionCode 7
              versionName "2.2"
            }

            buildTypes {
              debug {
                minifyEnabled false
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat << EOF > android_app/app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/drawable/ic_slh_luxury.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path
                android:fillColor="#090F16"
                android:pathData="M0,0h108v108h-108z" />
            <path
                android:fillColor="#0E1824"
                android:pathData="M14,14h80v80h-80z" />
            <path
                android:strokeColor="#2DD4BF"
                android:strokeWidth="1.2"
                android:strokeAlpha="0.65"
                android:fillColor="#00000000"
                android:pathData="M24,36h10l6,-6v-8M84,36h-10l-6,-6v-8M24,72h10l6,6v8M84,72h-10l-6,6v8" />
            <path
                android:strokeColor="#9333EA"
                android:strokeWidth="1.2"
                android:strokeAlpha="0.7"
                android:fillColor="#00000000"
                android:pathData="M54,18v12M54,78v12M20,54h10M78,54h10" />
                            <path
                android:strokeColor="#D4AF37"
                android:strokeWidth="3.4"
                android:fillColor="#00000000"
                android:pathData="M18,12h72a6,6 0 0,1 6,6v72a6,6 0 0,1 -6,6h-72a6,6 0 0,1 -6,-6v-72a6,6 0 0,1 6,-6z" />
            <path
                android:strokeColor="#F7DF8B"
                android:strokeWidth="1.1"
                android:fillColor="#00000000"
                android:pathData="M22,16h64a4,4 0 0,1 4,4v68a4,4 0 0,1 -4,4h-64a4,4 0 0,1 -4,-4v-68a4,4 0 0,1 4,-4z" />
            <path
                android:fillColor="#05080C"
                android:pathData="M45,35h-16l9,12l-9,12h16v6h-22l11,-14l-11,-14h22zM51,35h7v24h11v6h-18zM73,35h7v11h9v-11h7v30h-7v-13h-9v13h-7z" />
            <path
                android:fillColor="#E5BE46"
                android:strokeColor="#F7DF8B"
                android:strokeWidth="0.9"
                android:pathData="M44,33h-15l9,12l-9,12h15v5.5h-21l10.5,-13.5l-10.5,-13.5h21zM50,33h6.5v23h10.5v5.5h-17zM72,33h6.5v11h9v-11h6.5v28.5h-6.5v-12h-9v12h-6.5z" />
          </vector>
          EOF

          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="@string/app_name"
              android:icon="@drawable/ic_slh_luxury"
              android:roundIcon="@drawable/ic_slh_luxury"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview"
            android:layout_width="match_parent"
            android:layout_height="match_parent" />
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/cybersaleh/calc/MainActivity.java
          package com.cybersaleh.calc;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);

              WebView webView = findViewById(R.id.webview);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/index.html");
            }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android_app
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcSLH-Luxury-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          
