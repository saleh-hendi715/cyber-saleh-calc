name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - رئيسي
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android project
        run: |
          set -e
          mkdir -p android_app/app/src/main/java/com/cybersaleh/calc
          mkdir -p android_app/app/src/main/res/layout
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/assets

          cp index.html android_app/app/src/main/assets/index.html

          cat << 'EOF' > android_app/settings.gradle
          rootProject.name = "CyberSalehCalc"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat << 'EOF' > android_app/app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.cybersaleh.calc'
            compileSdk 34

            defaultConfig {
              applicationId "com.cybersaleh.calc"
              minSdk 23
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            buildTypes {
              debug {
                minifyEnabled false
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          
